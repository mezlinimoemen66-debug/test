<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Public</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#222}
  main{max-width:560px;margin:60px auto;padding:32px;background:#fff;border-radius:12px;box-shadow:0 2px 12px #0001;text-align:center}
  h1{margin:0 0 12px} .prix{font-size:28px;color:#0a7d4f;font-weight:700;margin-top:16px}
  small{color:#888}
</style>
</head>
<body>
<main>
  <h1 id="titre">...</h1>
  <p id="texte"></p>
  <div class="prix" id="prix"></div>
  <p><small>Site public: ybaddel wa7dou ki tbaddel mel admin</small></p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ===== Mba3d t7ot config mta3 Firebase houni (nafs el config fil admin.html) =====
const FIREBASE_CONFIG = null;
// Exemple:
// const FIREBASE_CONFIG = { apiKey:"...", authDomain:"...", projectId:"...", appId:"..." };
// ================================================================================

const DEF = { titre: "Marhba bik!", texte: "Hedha site test.", prix: 25 };
const useFB = FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey;
let db;
if (useFB) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }

function render(d) {
  document.getElementById("titre").textContent = d.titre;
  document.getElementById("texte").textContent = d.texte;
  document.getElementById("prix").textContent = d.prix + " DT";
}
function local() { try { return JSON.parse(localStorage.getItem("site")) || DEF; } catch (e) { return DEF; } }

if (useFB) db.doc("site/accueil").onSnapshot(s => render(s.data() || DEF));
else { render(local()); addEventListener("storage", () => render(local())); }
</script>
</body>
</html>
